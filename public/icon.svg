<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Shape -->
  <path d="M256 64 C352 96 400 128 400 240 C400 348 316 416 256 448 C196 416 112 348 112 240 C112 128 160 96 256 64 Z"
        fill="url(#shieldGrad)"
        filter="url(#shadow)" />

  <!-- Inner shield highlight outline -->
  <path d="M256 84 C338 112 380 142 380 240 C380 334 306 394 256 424 C206 394 132 334 132 240 C132 142 174 112 256 84 Z"
        fill="none"
        stroke="#e0f2fe"
        stroke-width="6"
        stroke-opacity="0.6" />

  <!-- Phone & Emergency Symbol in Center -->
  <g transform="translate(180, 160) scale(1.25)" fill="#ffffff">
    <!-- Phone handset icon -->
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="#ffffff"
          transform="scale(4.8) translate(0, 0)" />
  </g>

  <!-- Emergency Beacon Pulse Dot -->
  <circle cx="360" cy="140" r="24" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
</svg>
